# Publishes the CUTAS website (front end only, preview mode) to GitHub Pages.
# Runs on every push to main or backend-api, or manually from the Actions tab.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main, backend-api]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Site lives at https://<user>.github.io/<repository>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # No CUTAS server online yet: show the pages with a "preview" notice, make no API calls.
          VITE_PREVIEW_MODE: 'true'
      - name: Single-page app fallback (deep links such as /CUTAS/about)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
