{% extends "cutas_app/base.html" %}

{% block title %}{{ title }} · CUTAS Admin{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="pb-4 border-b border-slate-200">
        <a href="{% url 'cutas:workshops' %}" class="text-xs font-semibold text-cut-navy hover:underline">&larr; Back to Workshops</a>
        <h1 class="text-2xl font-bold text-cut-navy mt-2">{{ title }}</h1>
        <p class="text-xs text-slate-500">Academic seminar, thesis clinic, or methodology workshop.</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl p-8 shadow-sm">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Workshop Title</label>
                    <input type="text" name="title" value="{{ form.title.value|default:'' }}" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Facilitator / Speaker</label>
                    <input type="text" name="facilitator" value="{{ form.facilitator.value|default:'' }}" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" placeholder="Name and title" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Workshop Track / Category</label>
                    <input type="text" name="category" value="{{ form.category.value|default:'Methodology & Writing' }}" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Date</label>
                    <input type="date" name="event_date" value="{{ form.event_date.value|date:'Y-m-d'|default:'' }}" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Time (SAST)</label>
                    <input type="time" name="event_time" value="{{ form.event_time.value|time:'H:i'|default:'' }}" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" required>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Venue or Virtual Stream Link</label>
                    <input type="text" name="venue_or_link" value="{{ form.venue_or_link.value|default:'' }}" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" placeholder="Library Seminar Room 204 or MS Teams URL" required>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Abstract & Workshop Outline</label>
                    <textarea name="description" rows="5" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" required>{{ form.description.value|default:'' }}</textarea>
                </div>
            </div>

            <div class="pt-4 flex justify-end">
                <button type="submit" class="px-6 py-2.5 bg-cut-navy text-white text-xs font-bold rounded hover:bg-slate-800 transition-colors">
                    Publish Workshop
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
