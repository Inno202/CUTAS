{% extends "cutas_app/base.html" %}

{% block title %}{{ title }} · CUTAS Admin{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="pb-4 border-b border-slate-200">
        <a href="{% url 'cutas:funding' %}" class="text-xs font-semibold text-cut-navy hover:underline">&larr; Back to Funding Opportunities</a>
        <h1 class="text-2xl font-bold text-cut-navy mt-2">{{ title }}</h1>
        <p class="text-xs text-slate-500">Postgraduate bursary, fellowship, or travel grant listing.</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl p-8 shadow-sm">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Opportunity Title</label>
                    <input type="text" name="title" value="{{ form.title.value|default:'' }}" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Funding Body / Sponsor</label>
                    <input type="text" name="funder" value="{{ form.funder.value|default:'' }}" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" placeholder="e.g. National Research Foundation (NRF)" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Amount / Stipend Value</label>
                    <input type="text" name="amount_range" value="{{ form.amount_range.value|default:'' }}" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" placeholder="e.g. R140,000 p.a." required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Application Deadline</label>
                    <input type="date" name="deadline" value="{{ form.deadline.value|date:'Y-m-d'|default:'' }}" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">External Application Portal URL</label>
                    <input type="url" name="portal_url" value="{{ form.portal_url.value|default:'' }}" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" placeholder="https://...">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Eligibility Criteria</label>
                    <textarea name="eligibility" rows="4" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" required>{{ form.eligibility.value|default:'' }}</textarea>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Step-by-Step Application Process</label>
                    <textarea name="application_process" rows="4" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white" required>{{ form.application_process.value|default:'' }}</textarea>
                </div>
                <div class="flex items-center space-x-4">
                    <label class="flex items-center space-x-2 text-xs font-semibold text-slate-700">
                        <input type="checkbox" name="featured_on_landing" {% if form.featured_on_landing.value %}checked{% endif %} class="rounded text-cut-navy">
                        <span>Show on Landing Page</span>
                    </label>
                    <label class="flex items-center space-x-2 text-xs font-semibold text-slate-700">
                        <input type="checkbox" name="is_active" {% if form.is_active.value != False %}checked{% endif %} class="rounded text-cut-navy">
                        <span>Active Opportunity</span>
                    </label>
                </div>
            </div>

            <div class="pt-4 flex justify-end">
                <button type="submit" class="px-6 py-2.5 bg-cut-navy text-white text-xs font-bold rounded hover:bg-slate-800 transition-colors">
                    Save Funding Call
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
