{% extends "cutas_app/base.html" %}

{% block title %}Change Password · CUTAS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="bg-white border border-slate-200 rounded-xl p-8 shadow-sm">
        <h1 class="text-xl font-bold text-cut-navy mb-1">Change Account Password</h1>
        <p class="text-xs text-slate-500 mb-6">Enforce strong credentials protected with salted PBKDF2 hashing.</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Current Password</label>
                <input type="password" name="old_password" class="w-full px-3 py-2 border border-slate-300 rounded text-sm" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">New Password</label>
                <input type="password" name="new_password1" class="w-full px-3 py-2 border border-slate-300 rounded text-sm" required minlength="8">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Confirm New Password</label>
                <input type="password" name="new_password2" class="w-full px-3 py-2 border border-slate-300 rounded text-sm" required>
            </div>
            <div class="pt-2">
                <button type="submit" class="w-full py-2.5 bg-cut-navy text-white text-sm font-bold rounded hover:bg-slate-800 transition-colors">
                    Update Password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
